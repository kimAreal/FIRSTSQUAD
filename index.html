<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FIRST SQUAD｜第一分隊</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0a0c0f;
      color: #f4f4f4;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 28px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 4px;
      color: #8f949c;
    }

    h1 {
      margin: 18px 0 4px;
      font-size: 56px;
      line-height: 0.95;
    }

    h2 {
      margin: 10px 0 26px;
      font-size: 28px;
      color: #d64737;
    }

    p {
      max-width: 520px;
      margin: 0;
      color: #aeb3ba;
      line-height: 1.9;
      font-size: 15px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
    }

    .primary {
      background: #d64737;
      color: white;
      padding: 15px 22px;
      border-radius: 4px;
    }

    .secondary {
      border: 1px solid #3d424a;
      color: white;
      padding: 15px 22px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <main class="hero">

    <div class="eyebrow">
      CITY FIRE & RESCUE DEPARTMENT
    </div>

    <h1>FIRST SQUAD</h1>

    <h2>第一分隊</h2>

    <p>
      城市第一線消防救助單位，負責火災搶救、特殊救助、
      緊急醫療與重大災害應變。
    </p>

    <div class="buttons">
      <a href="team.html" class="primary">探索第一分隊</a>
      <a href="#" class="secondary">勤務紀錄</a>
    </div>

  </main>

</body>
</html>
